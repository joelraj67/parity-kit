name: 🐛 Bug report
description: Report a parity diff or crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Share a minimal repro.
  - type: input
    id: version
    attributes:
      label: parity-kit version
      placeholder: 1.0.0
    validations: { required: true }
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.x
  - type: textarea
    id: repro
    attributes:
      label: Repro (baseline + current URLs, config, viewport)
      placeholder: |
        baseline: https://example.com
        current: http://localhost:3000
        viewports: desktop 1280x800
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
